<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Today's scheduled walkthrough calls, pulled from Salesforce.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>My Day</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="home" class="screen">
      <header class="header">
        <h1>My Day</h1>
        <span class="header-meta" id="status-indicator">Loading&hellip;</span>
      </header>

      <div class="content">
        <div id="loading" class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading today&rsquo;s calls&hellip;</div>
        </div>

        <div id="error" class="error-container hidden">
          <div class="error-icon">&#9888;</div>
          <div class="error-message">Could not load your calls.</div>
          <button class="nav-item focusable" data-action="refresh">Retry</button>
        </div>

        <div id="myday-list" class="list-container hidden"></div>
      </div>

      <nav class="nav-bar">
        <button class="nav-item focusable" data-action="refresh">&#8635; Refresh</button>
      </nav>
    </div>

    <div id="detail" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <h1 id="detail-name">Name</h1>
      </header>

      <div class="tab-bar">
        <button class="tab-item focusable" data-action="tab" data-tab="status">Status</button>
        <button class="tab-item focusable" data-action="tab" data-tab="handoff">Handoff</button>
        <button class="tab-item focusable" data-action="tab" data-tab="dna">DNA</button>
      </div>

      <div class="content">
        <div id="tab-status" class="tab-panel">
          <div class="card">
            <div class="card-title">Current Stage</div>
            <div class="card-value" id="status-current-stage">&mdash;</div>
          </div>
          <div class="action-grid">
            <button class="action-btn focusable" data-action="mark-call" data-disposition="completed">Completed</button>
            <button class="action-btn focusable" data-action="mark-call" data-disposition="no_show">No Show</button>
            <button class="action-btn focusable" data-action="mark-call" data-disposition="rescheduled">Rescheduled</button>
            <button class="action-btn focusable" data-action="mark-call" data-disposition="canceled">Canceled</button>
          </div>
        </div>

        <div id="tab-handoff" class="tab-panel hidden">
          <div id="handoff-loading" class="loading-container">
            <div class="loading-spinner"></div>
          </div>
          <div id="handoff-content" class="hidden">
            <div class="card">
              <div class="card-title" id="handoff-status-title">Not handed off</div>
              <div class="card-subtitle" id="handoff-status-sub"></div>
            </div>
            <button class="nav-item danger focusable" id="handoff-btn" data-action="handoff">Hand Off This Call</button>
          </div>
        </div>

        <div id="tab-dna" class="tab-panel hidden">
          <div class="empty-message">DNA results coming soon.</div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
